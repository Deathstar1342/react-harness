name: Container foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Real Linux controller build and storage boundary checks
        run: python3 tests/container-linux.py
      - name: Portable broker protocol and egress checks
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tests -p 'test_worker_*.py' -v
      - name: Real owned worker PTY and container package transactions
        if: ${{ !cancelled() }}
        run: python3 tests/container-worker-linux.py
      - name: Actual source launcher and private terminal setup
        if: ${{ !cancelled() }}
        run: python3 tests/container-source-linux.py
      - name: Real private desktop supervisor lifecycle and native transfer handoff
        if: ${{ !cancelled() }}
        run: python3 tests/desktop-container-linux.py
      - name: Preserve container receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-foundation-${{ github.sha }}
          path: test-results/container/
          if-no-files-found: error

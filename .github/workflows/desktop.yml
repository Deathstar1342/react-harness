name: Desktop validation
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  electron:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Disposable Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat python3-venv xvfb libgbm1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run desktop:stage-runtime
          build/runtime/bin/node tests/desktop-runtime-probe.mjs
          build/runtime/bin/node tests/desktop-controller-linux.mjs
      - name: Real Linux Electron and dedicated backend
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
        timeout-minutes: 4
      - name: Real Windows Electron (no WSL distribution launch)
        if: runner.os == 'Windows'
        run: npm run desktop:smoke
      - name: Actual checkpoint Chrome and sandboxed Electron UI (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          export M34_RECEIPTS="$GITHUB_WORKSPACE/test-results/checkpoints"
          export M34_SOURCE="$GITHUB_SHA"
          export electron_config_cache="$RUNNER_TEMP/electron-cache"
          node --import tsx tests/milestone-34-browser.ts
          M34_ELECTRON=1 xvfb-run -a node --import tsx tests/milestone-34-browser.ts
      - name: Actual checkpoint Chrome and sandboxed Electron UI (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: |
          $env:M34_RECEIPTS=Join-Path $env:GITHUB_WORKSPACE 'test-results/checkpoints'
          $env:M34_SOURCE=$env:GITHUB_SHA
          $env:electron_config_cache=Join-Path $env:RUNNER_TEMP 'electron-cache'
          node --import tsx tests/milestone-34-browser.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:M34_ELECTRON='1'
          node --import tsx tests/milestone-34-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            test-results/electron-*.png
            test-results/checkpoints/

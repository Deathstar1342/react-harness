name: Desktop validation
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  electron:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Disposable Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat python3-venv xvfb libgbm1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run desktop:stage-runtime
          build/runtime/bin/node tests/desktop-runtime-probe.mjs
          build/runtime/bin/node tests/desktop-controller-linux.mjs
      - name: Real Linux Electron and dedicated backend
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
        timeout-minutes: 4
      - name: Real Windows Electron (no WSL distribution launch)
        if: runner.os == 'Windows'
        run: npm run desktop:smoke
      - name: Actual checkpoint Chrome and sandboxed Electron UI (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          export M34_RECEIPTS="$GITHUB_WORKSPACE/test-results/checkpoints"
          export M34_SOURCE="$GITHUB_SHA"
          export electron_config_cache="$RUNNER_TEMP/electron-cache"
          node --import tsx tests/milestone-34-browser.ts
          M34_ELECTRON=1 xvfb-run -a node --import tsx tests/milestone-34-browser.ts
      - name: Actual checkpoint Chrome and sandboxed Electron UI (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: |
          $env:M34_RECEIPTS=Join-Path $env:GITHUB_WORKSPACE 'test-results/checkpoints'
          $env:M34_SOURCE=$env:GITHUB_SHA
          $env:electron_config_cache=Join-Path $env:RUNNER_TEMP 'electron-cache'
          node --import tsx tests/milestone-34-browser.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:M34_ELECTRON='1'
          node --import tsx tests/milestone-34-browser.ts
      - name: Actual gated browser and isolated native project preview (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          export M35_APP_ROOT="$GITHUB_WORKSPACE/build/app"
          export M35_UI_OUTPUT="$RUNNER_TEMP/m35-project-ui"
          export M35_SOURCE="$GITHUB_SHA"
          export M35_RECEIPTS="$GITHUB_WORKSPACE/test-results/preview/native"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/m35-python-cache"
          node node_modules/vite/bin/vite.js build --config tests/preview-vite.config.ts
          xvfb-run -a node --import tsx tests/milestone-35-native.ts
          M35_RECEIPTS="$GITHUB_WORKSPACE/test-results/preview/browser" M35_BROWSER_BIND=1 M35_BROWSER_ONLY=1 xvfb-run -a node --import tsx tests/milestone-35-native.ts
      - name: Actual gated browser and isolated native project preview (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: |
          $env:M35_APP_ROOT=Join-Path $env:GITHUB_WORKSPACE 'build/app'
          $env:M35_UI_OUTPUT=Join-Path $env:RUNNER_TEMP 'm35-project-ui'
          $env:M35_SOURCE=$env:GITHUB_SHA
          $env:M35_RECEIPTS=Join-Path $env:GITHUB_WORKSPACE 'test-results/preview/native'
          $env:TEMP=Join-Path $env:RUNNER_TEMP 'm35-temp'
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $env:TMP=$env:TEMP
          $env:TMPDIR=$env:TEMP
          $env:PYTHONPYCACHEPREFIX=Join-Path $env:RUNNER_TEMP 'm35-python-cache'
          node node_modules/vite/bin/vite.js build --config tests/preview-vite.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx tests/milestone-35-native.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:M35_RECEIPTS=Join-Path $env:GITHUB_WORKSPACE 'test-results/preview/browser'
          $env:M35_BROWSER_BIND='1'
          $env:M35_BROWSER_ONLY='1'
          node --import tsx tests/milestone-35-native.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            test-results/electron-*.png
            test-results/checkpoints/
            test-results/preview/

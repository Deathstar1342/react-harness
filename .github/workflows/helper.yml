name: Privileged helper validation
on: [push, pull_request, workflow_dispatch]
jobs:
  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Disposable runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-apt acl build-essential bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # First adapter supports fixed HTTP(S) repositories, not mirror-list indirection.
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          # Hosted image makes /usr/share writable; record and normalize only in this disposable VM.
          stat -c '%U %G %a %n' /usr/share
          getfacl -p /usr/share
          sudo chown root:root /usr/share
          sudo setfacl -b -k /usr/share
          sudo chmod 0755 /usr/share
          # Hosted Swift cache entries resolve into writable runner toolchains.
          # Test a distro-only loader cache; production never changes loader policy.
          printf '/lib/x86_64-linux-gnu\n/usr/lib/x86_64-linux-gnu\n' | sudo tee /etc/ld.so.conf
          sudo /usr/sbin/ldconfig
          test "$(id -u)" != 0
      - run: npm ci
      - name: Portable helper state tests
        run: python3 -m unittest discover -s helper -p 'test_*.py'
      - name: Build and explicitly stage trusted helper artifact
        run: |
          mkdir -p build/helper
          cc -static -O2 -Wall -Wextra -Werror helper/launcher.c -o build/helper/launcher
          file build/helper/launcher | tee build/helper/launcher-type.txt
          grep -q 'statically linked' build/helper/launcher-type.txt
          sudo install -d -m 0755 /usr/lib/abyssus-helper
          sudo install -m 0755 build/helper/launcher /usr/lib/abyssus-helper/launcher
          sudo install -m 0644 helper/core.py helper/service.py helper/admin.py helper/apt_adapter.py helper/apt.conf helper/abyssus-helper.service /usr/lib/abyssus-helper/
          sudo install -d -m 0755 /usr/lib/abyssus-helper/python
          sudo install -d -m 0755 /usr/lib/abyssus-helper/empty-apt-config
          sudo ln -s /usr/lib/python3/dist-packages/apt /usr/lib/abyssus-helper/python/apt
          for module in /usr/lib/python3/dist-packages/apt_pkg.*.so /usr/lib/python3/dist-packages/apt_inst.*.so; do
            sudo ln -s "$module" /usr/lib/abyssus-helper/python/
          done
          sudo install -m 0600 tests/helper-root-fixture.py /root/abyssus-helper-ci.py
          sudo touch /root/abyssus-ci-authorized
      - name: Required real helper service/install/repair/removal tests
        run: |
          /usr/bin/python3 -I -S tests/helper-resolver-probe.py
          node --import tsx tests/helper-linux.ts
      - name: Safe service failure diagnostics
        if: failure()
        run: |
          sudo systemctl status abyssus-helper.service --no-pager || true
          sudo find /etc/apt /var/lib/apt/lists /var/lib/dpkg/status /var/lib/apt/extended_states \( -type l -o ! -user root -o -perm /022 \) -printf '%u %m %p\n'
          # No config/descriptor, package output, journal, credentials or audit contents.
          sudo /usr/lib/abyssus-helper/launcher serve || true
        timeout-minutes: 1

name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Disposable Linux sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat python3-venv
          # This runner is disposable. Do not apply these settings to a user's host.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(id -u)" != 0
          bwrap --version
          socat -V
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
